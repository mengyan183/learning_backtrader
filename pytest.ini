; pytest 配置（补于 2026-09-23）
;
; 为什么需要它：仓库此前**没有任何 pytest 配置**，裸跑 `pytest` 会递归收集
; 到教学目录 learning_lesson1/2/3 —— 而 learning_lesson3/__init__.py 在
; **import 阶段**就联网抓 tushare（`ts.pro_bar`），无代理时 30 秒超时 ×3 重试，
; 直接导致**收集失败**（Interrupted: 1 error during collection），
; 483 个真实测试一个都跑不到。
;
; 现象具有误导性：报错是 `OSError: ERROR.` 加一长串 HTTP 超时堆栈，
; 完全看不出「测试套件没跑」。在换机器（如家里 Mac）时尤其容易踩。
;
; 实测（2026-09-23）：加 testpaths 后 `pytest -q` ⇒ 483 passed。
;
; 注意：教学目录仍是仓库的一部分，只是**不参与默认测试收集**。
; 需要时显式指定：pytest learning_lesson1

[pytest]
testpaths = tests
