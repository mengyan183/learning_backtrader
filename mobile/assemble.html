<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分片合并 → APK</title>
<style>
  :root { --fg:#111; --mut:#666; --line:#e3e3e8; --ok:#0a7d33; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 48px; font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--fg); background:#fafafa; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  ol { margin:0; padding-left:20px; } ol li { margin-bottom:6px; }
  code { background:#f0f0f3; padding:1px 5px; border-radius:4px; font-size:13px; }
  #pick { display:block; width:100%; padding:14px; font-size:16px; border-radius:10px;
          border:1px dashed #bbb; background:#fff; }
  #go { display:block; width:100%; margin-top:12px; padding:15px; font-size:17px; font-weight:600;
        border:0; border-radius:10px; background:#111; color:#fff; }
  #go:disabled { background:#c8c8cc; }
  .stat { margin-top:12px; font-size:14px; color:var(--mut); white-space:pre-wrap; }
  .ok  { color:var(--ok); font-weight:600; }
  .err { color:var(--err); font-weight:600; }
  #list { margin:10px 0 0; padding:0; list-style:none; font-size:13px; }
  #list li { padding:3px 0; border-bottom:1px solid #f2f2f4; display:flex; justify-content:space-between; }
  #list li span:last-child { color:var(--mut); }
</style>
</head>
<body>

<h1>分片合并 → APK</h1>
<div class="sub">公司传输限制拦的是**大文件**，所以 APK 被切成了若干小片。<br>本页把它们拼回完整的 <code>app-debug.apk</code>。</div>

<div class="card">
  <ol>
    <li>飞书里的分片文件，全部「<b>保存到手机</b>」</li>
    <li>点下面按钮，<b>一次选中所有分片</b>（可多选）</li>
    <li>点「开始合并」，会下载出 <code>app-debug.apk</code></li>
    <li>到「下载」里点它安装</li>
  </ol>
</div>

<div class="card">
  <input id="pick" type="file" multiple>
  <button id="go" disabled>开始合并</button>
  <div class="stat" id="stat">尚未选择文件</div>
  <ul id="list"></ul>
</div>

<script>
(function () {
  var pick = document.getElementById('pick'),
      go   = document.getElementById('go'),
      stat = document.getElementById('stat'),
      list = document.getElementById('list');

  function fmt(n) {
    return n < 1024 ? n + ' B'
         : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
         : (n / 1048576).toFixed(2) + ' MB';
  }
  // 按文件名里的数字自然排序，保证 part01 < part02 < ... < part10
  function byName(a, b) {
    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  }

  var files = [];

  pick.addEventListener('change', function () {
    files = Array.prototype.slice.call(pick.files).sort(byName);
    list.innerHTML = '';
    var total = 0;
    files.forEach(function (f) {
      total += f.size;
      var li = document.createElement('li');
      li.innerHTML = '<span></span><span></span>';
      li.children[0].textContent = f.name;
      li.children[1].textContent = fmt(f.size);
      list.appendChild(li);
    });
    go.disabled = files.length === 0;
    stat.textContent = files.length
      ? '已选 ' + files.length + ' 个分片，合计 ' + fmt(total)
      : '尚未选择文件';
  });

  go.addEventListener('click', async function () {
    if (!files.length) return;
    go.disabled = true;
    stat.className = 'stat';
    try {
      var parts = [];
      for (var i = 0; i < files.length; i++) {
        stat.textContent = '读取中… (' + (i + 1) + '/' + files.length + ') ' + files[i].name;
        parts.push(await files[i].arrayBuffer());
      }
      var blob = new Blob(parts, { type: 'application/vnd.android.package-archive' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'app-debug.apk';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);

      stat.className = 'stat ok';
      stat.textContent = '✅ 合并完成，共 ' + fmt(blob.size) + '\n'
        + '已开始下载 app-debug.apk，到「下载」里点它安装。';
    } catch (e) {
      stat.className = 'stat err';
      stat.textContent = '❌ 合并失败：' + e.message;
    } finally {
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
